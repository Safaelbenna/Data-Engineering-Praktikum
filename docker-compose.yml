services:
  virtuoso:
    image: openlink/virtuoso-opensource-7
    container_name: deltagraph_virtuoso
    environment:
      DBA_PASSWORD: mysecret
      SPARQL_UPDATE: "true"
      VIRT_Parameters_DirsAllowed: "/database/test data"
    ports:
      - "1111:1111"
      - "8890:8890"
    volumes:
      - virtuoso-db:/database
      - ./test data:/database/test data

volumes:
  virtuoso-db:
